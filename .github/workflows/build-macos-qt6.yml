---
name: 🍎 Build - MacOS Qt6
on:
  push:
    branches:
      - master
      - release-**
  pull_request:
  release:
    types: ['published']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  packages: write
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            triplet: arm64-osx-dynamic-release
            deployment-target: "11.0"
            osx-architecture: "arm64"
    name: build (macos)
    runs-on: ${{ matrix.os }}
    env:
      FC: gfortran
      GCC_VERSION: 15

    steps:
      - name: 🐣 Checkout
        uses: actions/checkout@v6

      - name: 🐩 Install CMake and Ninja
        uses: lukka/get-cmake@f176ccd3f28bda569c43aae4894f06b2435a3375 # latest
        with:
          # Pin to specific version to avoid rebuilding too often
          # Also helps to avoid spurious build failures like https://github.com/qgis/QGIS/pull/47098
          cmakeVersion: 3.30.4

      - name: 🎡 Setup vcpkg
        id: setup-vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: 🎲 Get artifact ids
        id: workflow-artifact-ids
        uses: ./.github/actions/get-workflow-artifact-ids

      - name: 🔨 Prepare build env
        run: |
          brew install automake bison flex gnu-sed autoconf-archive nasm libtool fdupes mono
          # GDAL 3.12.x typemaps still use PyInt_*; SWIG 4.5 removed those macros.
          # Pin SWIG 4.4.1 so vcpkg GDAL python bindings can rebuild when binary cache misses.
          brew tap-new --no-git local/pinned
          brew extract --version=4.4.1 swig local/pinned
          brew install local/pinned/swig@4.4.1
          SWIG_BIN="$(brew --prefix local/pinned/swig@4.4.1)/bin"
          echo "${SWIG_BIN}" >> "$GITHUB_PATH"
          export PATH="${SWIG_BIN}:${PATH}"
          swig -version
          echo $(brew --prefix bison)/bin >> $GITHUB_PATH
          echo $(brew --prefix flex)/bin >> $GITHUB_PATH
          echo $(brew --prefix libtool)/bin >> $GITHUB_PATH

      - name: Symlink gfortran (macOS)
        run: |
          # make sure gfortran is available
          # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
          # https://github.com/actions/runner-images/issues/3371
          sudo ln -fs /opt/homebrew/bin/gfortran-${GCC_VERSION} /usr/local/bin/gfortran
          sudo mkdir -p /usr/local/gfortran
          sudo ln -sf /opt/homebrew/Cellar/gcc@${GCC_VERSION}/*/lib/gcc/${GCC_VERSION} /usr/local/gfortran/lib

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🍭 Setup XCode
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: latest-stable

      - name: 🛍️ Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 500M
          key: build-ccache-${{ matrix.triplet }}-qt6-${{ github.event.pull_request.base.ref || github.ref_name }}
          save: ${{ github.event_name == 'push' }}

      - name: 🛍️ Tune ccache configuration
        shell: bash
        run: |
          # To make ccache work properly with precompiled headers
          ccache --set-config sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime

      - name: 🌱 Install dependencies and generate project files
        env:
          X_VCPKG_ASSET_SOURCES: x-azurl,https://assetcache.open-vcpkg.org/assetcache,,read
        run: |
          echo "VCPKG_ROOT: ${VCPKG_ROOT}"

          # Install first only with binarycaching, then deduplicate binaries and replace copies with symlinks.
          # Nuget doesn't understand the symlink concept
          cmake -S . \
                -G Ninja \
                -B build \
                -D QGIS_APP_NAME="HAKE-GIS-${{steps.workflow-artifact-ids.outputs.display-name}}" \
                -D WITH_VCPKG=ON \
                -D WITH_QTWEBENGINE=ON \
                -D WITH_BINDINGS=ON \
                -D WITH_ORACLE=ON \
                -D WITH_GEOGRAPHICLIB=ON \
                -D WITH_SFCGAL=ON \
                -D WITH_PROJ_DATA=ON \
                -D VCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" \
                -D VCPKG_HOST_TRIPLET="${{ matrix.triplet }}" \
                -D VCPKG_INSTALL_OPTIONS="--only-binarycaching" \
                -D CMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment-target }} \
                -D CMAKE_OSX_ARCHITECTURES=${{ matrix.osx-architecture }} \
                -D ENABLE_UNITY_BUILDS=ON \
                -D HAKE_GIT_REVISION=${{ github.sha }} \
                -D NUGET_USERNAME=${{ github.actor }} \
                -D NUGET_SOURCE="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
                -D NUGET_READ_SOURCE="https://nuget.pkg.github.com/qgis/index.json" \
                -D NUGET_READ_USERNAME=qgis \
                -D NUGET_TOKEN=${{ secrets.GITHUB_TOKEN }} || true

                fdupes -q -r -1 build/vcpkg_installed/${{ matrix.triplet }}/lib | grep -E '\.(so|dylib)' | while read line; do master=""; for file in ${line[*]}; do if  [[ "x${master}" == "x" ]]; then master=$file; else rm "${file}"; ln -s $(basename "${master}") "${file}"; fi; done; done

                cmake -D VCPKG_INSTALL_OPTIONS="" -D ENABLE_UNITY_BUILDS=ON -D HAKE_GIT_REVISION=${{ github.sha }} build

      - name: 📑 Upload vcpkg build logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-logs-${{ matrix.triplet }}
          path: |
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log

      - name: 📦 Create SDK
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        run: |
          ${VCPKG_ROOT}/vcpkg export --zip --output-dir=./sdk --x-install-root=./build/vcpkg_installed  --x-manifest-root=vcpkg

      - name: 📤 Upload sdk
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: hake-gis-sdk-${{ matrix.triplet }}
          path: |
            sdk/vcpkg-export-*.zip

      - name: 🌋 Build
        run: |
          # We make sure the target "all" is built before bundling
          # Ideally, we would specify each target that is required to be installed, but this workaround is sufficient for now
          cmake --build build
          cmake --build build --target bundle

      - name: Verify packaged Hake Night theme
        run: |
          found=0
          for app in ./build/_CPack_Packages/Darwin/External/*/*.app; do
            find "$app" -path "*resources/themes/Hake Night/style.qss" | grep -q . || { echo "Hake Night theme missing in $app"; exit 1; }
            python3 scripts/hake_theme_validate.py --installed "$app"
            found=1
          done
          [ "$found" -eq 1 ] || { echo "No .app bundle found"; exit 1; }

      - name: Verify packaged code revision
        run: |
          found=0
          for app in ./build/_CPack_Packages/Darwin/External/*/*.app; do
            process_exe="$(find "$app" -type f -name hake-geodesk-process | head -1)"
            python3 scripts/ci/hake_verify_revision.py \
              --expected "${{ github.sha }}" \
              --package-root "$app" \
              --process-exe "$process_exe"
            found=1
          done
          [ "$found" -eq 1 ] || { echo "No .app bundle found"; exit 1; }

      - name: Archive app
        run: |
          gtar -cpvzf hake-gis-app-${{steps.workflow-artifact-ids.outputs.filename}}-${{ matrix.triplet }}.tar.gz ./build/_CPack_Packages/Darwin/External/*/*.app

      - name: 📤 Upload app
        uses: actions/upload-artifact@v7
        with:
          name: hake-gis-app-${{steps.workflow-artifact-ids.outputs.filename}}-${{ matrix.triplet }}
          path: |
            hake-gis-app-${{steps.workflow-artifact-ids.outputs.filename}}-${{ matrix.triplet }}.tar.gz

  schedule_download_comment:
    name: Create dmg
    runs-on: macos-latest
    needs: build
    steps:
      - name: 🐣 Checkout
        uses: actions/checkout@v6

      - name: 🔨 Prepare build env
        run: |
          brew install create-dmg


      - name: 🎲 Get artifact ids
        id: workflow-artifact-ids
        uses: ./.github/actions/get-workflow-artifact-ids

      - name: 📤 Download app
        uses: actions/download-artifact@v8
        with:
          pattern: hake-gis-app-${{steps.workflow-artifact-ids.outputs.filename}}-*
          path: |
            artifacts

      - name: Extract app
        run: |
          mkdir -p arm64
          # download-artifact extracts a single pattern match flat into path/;
          # multiple matches nest under path/<artifact-name>/.
          ARCHIVE=$(find artifacts -name "hake-gis-app-${{steps.workflow-artifact-ids.outputs.filename}}-arm64-osx-dynamic-release.tar.gz" | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "No arm64 app archive found under artifacts/" >&2
            find artifacts -type f | head -50 >&2
            exit 1
          fi
          echo "Extracting $ARCHIVE"
          gtar --strip-components=5 -zxf "$ARCHIVE" -C arm64

      - name: Create dmg
        run: |
          APP_BUNDLE=$(find arm64 -name '*.app' | head -1)
          APP_DIR=$(dirname "${APP_BUNDLE}")
          APP_NAME=$(basename "${APP_BUNDLE}" .app)
          create-dmg --volname "Hake Geodesk Installer" \
            --hide-extension "${APP_NAME}.app" \
            --volicon "$(pwd)/images/icons/mac/hake-gis.icns" \
            --background "$(pwd)/platform/macos/installer_background.png" \
            --window-pos 200 120 \
            --window-size 512 320 \
            --icon-size 100 \
            --icon "${APP_NAME}.app" 130 160 \
            --app-drop-link 400 155 \
            Hake-Geodesk-Installer.dmg \
            "${APP_DIR}"

      - name: 📤 Upload app
        uses: actions/upload-artifact@v7
        id: artifact-mac-qt6
        with:
          name: hake-geodesk-installer-macos
          path: |
            *.dmg

      - name: Upload release assets
        uses: AButler/upload-release-assets@v3.0
        if: ${{ github.event_name == 'release' }}
        with:
          files: '*.dmg'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger notarization
        if: ${{ github.event_name == 'release' }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.NOTARIZE_TOKEN }}" \
            https://api.github.com/repos/Subhankar-hub/hake-gis-notarize/dispatches \
            -d '{"event_type":"notarize_dmg","client_payload":{"release_tag":"${{ github.ref_name }}"}}'

      - name: Schedule download comment
        uses: ./.github/actions/post_sticky_comment
        if: github.event_name == 'pull_request'
        with:
          marker: macos-qt6
          body: |
            ### 🍎 MacOS Qt6 builds
            Download [MacOS Qt6 builds of this PR for testing](${{ steps.artifact-mac-qt6.outputs.artifact-url }}).
            _This app is not notarized, run `sudo xattr -d com.apple.quarantine /Applications/HAKE-GIS*.app` to avoid the warning_
            *(Built from commit ${{ github.event.pull_request.head.sha }})*
          pr: ${{ github.event.number }}
